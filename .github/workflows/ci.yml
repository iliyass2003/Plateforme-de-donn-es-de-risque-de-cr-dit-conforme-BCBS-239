# Intégration continue : vérifications automatiques à chaque envoi et pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Code Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check ingestion tests airflow scripts

  dbt:
    name: Projet dbt (parse)
    runs-on: ubuntu-latest
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "dbt-postgres>=1.9,<2"
      - run: dbt parse --profiles-dir .
        working-directory: dbt/credit_risk

  terraform:
    name: Infrastructure (Terraform)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  docker:
    name: Conteneurs (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet